<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond sombre arrondi -->
  <rect width="512" height="512" rx="96" fill="#1A0A00"/>

  <!-- Corps rond CupHead -->
  <circle cx="256" cy="226" r="162" fill="#FF6B35" stroke="#000" stroke-width="16"/>

  <!-- Bordure intérieure décorative -->
  <circle cx="256" cy="226" r="142" fill="none" stroke="#CC4400" stroke-width="6" opacity="0.4"/>

  <!-- Yeux -->
  <ellipse cx="200" cy="196" rx="26" ry="28" fill="#000"/>
  <ellipse cx="312" cy="196" rx="26" ry="28" fill="#000"/>

  <!-- Reflets des yeux -->
  <circle cx="210" cy="186" r="9" fill="#fff"/>
  <circle cx="322" cy="186" r="9" fill="#fff"/>

  <!-- Sourire -->
  <path d="M 182 268 Q 256 328 330 268" stroke="#000" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Joues -->
  <ellipse cx="168" cy="258" rx="22" ry="14" fill="#FF9966" opacity="0.7"/>
  <ellipse cx="344" cy="258" rx="22" ry="14" fill="#FF9966" opacity="0.7"/>

  <!-- Jambes -->
  <rect x="214" y="378" width="30" height="52" rx="12" fill="#FF6B35" stroke="#000" stroke-width="10"/>
  <rect x="268" y="378" width="30" height="52" rx="12" fill="#FF6B35" stroke="#000" stroke-width="10"/>

  <!-- Texte AX -->
  <text
    x="256" y="478"
    font-family="Arial Black, Impact, sans-serif"
    font-size="68"
    font-weight="900"
    text-anchor="middle"
    fill="#FFD700"
